steps:
  # Temporary probe: find clang/LLVM on Medusa, then fail so the rest of the
  # job (conan + ffmpeg) does not run. Remove after the probe build.
  - script: |
      echo ===== agent =====
      echo AGENT_NAME=%AGENT_NAME%
      echo AGENT_MACHINENAME=%AGENT_MACHINENAME%
      echo AGENT_OS=%AGENT_OS%
      echo AGENT_OSARCHITECTURE=%AGENT_OSARCHITECTURE%
      echo COMPUTERNAME=%COMPUTERNAME%
      echo PATH (truncated)=%PATH:~0,500%

      echo.
      echo ===== vswhere =====
      set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
      if exist "%VSWHERE%" (
        echo vswhere found: %VSWHERE%
        "%VSWHERE%" -latest -property installationPath
        echo --- productId / catalog ---
        "%VSWHERE%" -latest -property displayName
        "%VSWHERE%" -latest -property catalog_productLineVersion
        echo --- requires VC.Llvm.Clang? ---
        "%VSWHERE%" -latest -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
        if errorlevel 1 echo vswhere: VC.Llvm.Clang component NOT installed
        echo --- vswhere -find clang.exe ---
        "%VSWHERE%" -latest -find **\clang.exe
      ) else (
        echo vswhere NOT found
      )

      echo.
      echo ===== known clang/LLVM paths =====
      for %%P in (
        "C:\Program Files\LLVM\bin\clang.exe"
        "C:\Program Files (x86)\LLVM\bin\clang.exe"
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang.exe"
        "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Tools\Llvm\x64\bin\clang.exe"
        "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang.exe"
        "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin\clang.exe"
      ) do (
        if exist %%P (echo FOUND %%~P) else (echo MISSING %%~P)
      )

      echo.
      echo ===== where clang / clang-cl / llvm =====
      where clang 2>nul || echo where: clang not on PATH
      where clang.exe 2>nul || echo where: clang.exe not on PATH
      where clang-cl 2>nul || echo where: clang-cl not on PATH
      where llvm-config 2>nul || echo where: llvm-config not on PATH

      echo.
      echo ===== dir VS Llvm folders if VS exists =====
      if exist "C:\Program Files\Microsoft Visual Studio\2022" (
        dir /b /s "C:\Program Files\Microsoft Visual Studio\2022\*clang.exe" 2>nul
        dir /b /ad "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\Llvm" 2>nul
      ) else (
        echo VS 2022 folder not at default path
      )
      if exist "C:\Program Files\LLVM" (
        echo LLVM folder listing:
        dir /b "C:\Program Files\LLVM"
        dir /b "C:\Program Files\LLVM\bin" 2>nul
      ) else (
        echo C:\Program Files\LLVM does not exist
      )

      echo.
      echo ===== probe done; failing to skip remaining pipeline steps =====
      exit /b 1
    displayName: Probe LLVM/clang on Medusa (then exit)

  - checkout: self
  - checkout: topaz-conan-dev
  - checkout: nv-codec-headers
  - checkout: pipeline-helper
    
  - template: set_tools_and_deps.yml
    parameters:
      OS: 'win'
      SHOULD_RESTORE_CONAN_CACHE: true

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      unix2dos ./build-scripts/win/configure-win.patch
      git apply ./build-scripts/win/configure-win.patch
      # Patches are already applied
      # git apply ./build-scripts/configure-zimg.patch
      # git apply ./build-scripts/configure-aom.patch
      git apply ./build-scripts/configure-dav1d.patch
      bash ./build-scripts/win/conan_win.sh
    displayName: Install conan packages

  - script: |
      pushd "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
      for /f "delims=" %%x in ('.\vswhere.exe -latest -property InstallationPath') do set VSPATH=%%x
      popd
      call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64

      cd /d "C:\msys64"
      set MSYSTEM=MINGW64
      C:\msys64\msys2_shell.cmd -defterm -no-start -mingw64 -c "$(cygpath '$(Build.SourcesDirectory)/FFmpeg/build-scripts/win/build_win.sh')"
    displayName: Set up MSVC toolchain and build

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      if [[ "${BUILD_REASON}" == "PullRequest" || -z "${PUBLISH}" ]]; then
        exit 0
      else
        mkdir -p "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cp build-scripts/deploy_conanfile.py "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/conanfile.py"
        cp -Rp "output-conan"/* "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cd "$(Build.SourcesDirectory)/topaz-conan-dev"
        ./run_publish_prebuilt.sh --package-name topaz-ffmpeg --package-version "$(VERSION)" -r topaz-conan
      fi
    displayName: Publish to conan

  - bash: |
      cp "$(Build.SourcesDirectory)/pipeline-helper/dependency-manager/dependency_viewer.py" "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      cd "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      # if [ "$ARCH" == "ARM64" ]; then
      #   arch="armv8"
      # else
      #   arch="x86_64"
      # fi

      arch="x86_64"

      cp ./win/profile_win2022 ./profile_win2022

      python dependency_viewer.py -os=WIN -ar=$arch -v="$(VERSION)" -bn="$BUILD_NOTE" -a="$(Build.RequestedFor)" -cf="deploy_conanfile.py" -sc="C09QW35D2DR"
    condition: and(succeeded(), ne(variables['PUBLISH'], ''))
    displayName: Slack Dependency Manager
    continueOnError: true 
    env:
      ARCH: ${{ parameters.arch }}
      DEPENDENCY_MANAGER_SLACK_WEBHOOK: $(DEPENDENCY_MANAGER_SLACK_WEBHOOK)
      BUILD_TYPE: ""