steps:
  # Temporary probe: find clang/LLVM on Medusa, then fail so the rest of the
  # job (conan + ffmpeg) does not run. Remove after the probe build.
  - powershell: |
      Write-Host "===== agent ====="
      Write-Host "AGENT_NAME=$env:AGENT_NAME"
      Write-Host "AGENT_MACHINENAME=$env:AGENT_MACHINENAME"
      Write-Host "AGENT_OS=$env:AGENT_OS"
      Write-Host "AGENT_OSARCHITECTURE=$env:AGENT_OSARCHITECTURE"
      Write-Host "COMPUTERNAME=$env:COMPUTERNAME"

      Write-Host ""
      Write-Host "===== vswhere ====="
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      if (Test-Path $vswhere) {
        Write-Host "vswhere found: $vswhere"
        Write-Host "installationPath:"
        & $vswhere -latest -property installationPath
        Write-Host "displayName:"
        & $vswhere -latest -property displayName
        Write-Host "catalog_productLineVersion:"
        & $vswhere -latest -property catalog_productLineVersion
        Write-Host "--- requires VC.Llvm.Clang? ---"
        $clangVs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
        if ($clangVs) { Write-Host "VC.Llvm.Clang installed at: $clangVs" } else { Write-Host "VC.Llvm.Clang component NOT installed" }
        Write-Host "--- vswhere -find clang.exe ---"
        & $vswhere -latest -find "**\clang.exe"
      } else {
        Write-Host "vswhere NOT found at $vswhere"
      }

      Write-Host ""
      Write-Host "===== known clang/LLVM paths ====="
      $candidates = @(
        "$env:ProgramFiles\LLVM\bin\clang.exe",
        "${env:ProgramFiles(x86)}\LLVM\bin\clang.exe",
        "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang.exe",
        "$env:ProgramFiles\Microsoft Visual Studio\2022\Professional\VC\Tools\Llvm\x64\bin\clang.exe",
        "$env:ProgramFiles\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang.exe",
        "$env:ProgramFiles\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin\clang.exe"
      )
      foreach ($p in $candidates) {
        if (Test-Path $p) { Write-Host "FOUND $p" } else { Write-Host "MISSING $p" }
      }

      Write-Host ""
      Write-Host "===== Get-Command clang / clang-cl / llvm ====="
      foreach ($cmd in @("clang", "clang.exe", "clang-cl", "llvm-config")) {
        $g = Get-Command $cmd -ErrorAction SilentlyContinue
        if ($g) { Write-Host "PATH has ${cmd}: $($g.Source)" } else { Write-Host "PATH missing: $cmd" }
      }

      Write-Host ""
      Write-Host "===== search VS 2022 for clang.exe (depth-limited) ====="
      $vsRoot = "$env:ProgramFiles\Microsoft Visual Studio\2022"
      if (Test-Path $vsRoot) {
        Get-ChildItem $vsRoot -Recurse -Filter clang.exe -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty FullName
        Get-ChildItem $vsRoot -Recurse -Directory -Filter Llvm -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty FullName
      } else {
        Write-Host "VS 2022 folder not at $vsRoot"
      }

      $llvmDir = "$env:ProgramFiles\LLVM"
      if (Test-Path $llvmDir) {
        Write-Host "LLVM folder listing:"
        Get-ChildItem $llvmDir | Select-Object -ExpandProperty Name
        if (Test-Path "$llvmDir\bin") { Get-ChildItem "$llvmDir\bin" | Select-Object -ExpandProperty Name }
      } else {
        Write-Host "$llvmDir does not exist"
      }

      Write-Host ""
      Write-Host "===== probe done; failing to skip remaining pipeline steps ====="
      exit 1
    displayName: Probe LLVM/clang on Medusa (then exit)

  - checkout: self
  - checkout: topaz-conan-dev
  - checkout: nv-codec-headers
  - checkout: pipeline-helper
    
  - template: set_tools_and_deps.yml
    parameters:
      OS: 'win'
      SHOULD_RESTORE_CONAN_CACHE: true

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      unix2dos ./build-scripts/win/configure-win.patch
      git apply ./build-scripts/win/configure-win.patch
      # Patches are already applied
      # git apply ./build-scripts/configure-zimg.patch
      # git apply ./build-scripts/configure-aom.patch
      git apply ./build-scripts/configure-dav1d.patch
      bash ./build-scripts/win/conan_win.sh
    displayName: Install conan packages

  - script: |
      pushd "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
      for /f "delims=" %%x in ('.\vswhere.exe -latest -property InstallationPath') do set VSPATH=%%x
      popd
      call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64

      cd /d "C:\msys64"
      set MSYSTEM=MINGW64
      C:\msys64\msys2_shell.cmd -defterm -no-start -mingw64 -c "$(cygpath '$(Build.SourcesDirectory)/FFmpeg/build-scripts/win/build_win.sh')"
    displayName: Set up MSVC toolchain and build

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      if [[ "${BUILD_REASON}" == "PullRequest" || -z "${PUBLISH}" ]]; then
        exit 0
      else
        mkdir -p "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cp build-scripts/deploy_conanfile.py "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/conanfile.py"
        cp -Rp "output-conan"/* "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cd "$(Build.SourcesDirectory)/topaz-conan-dev"
        ./run_publish_prebuilt.sh --package-name topaz-ffmpeg --package-version "$(VERSION)" -r topaz-conan
      fi
    displayName: Publish to conan

  - bash: |
      cp "$(Build.SourcesDirectory)/pipeline-helper/dependency-manager/dependency_viewer.py" "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      cd "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      # if [ "$ARCH" == "ARM64" ]; then
      #   arch="armv8"
      # else
      #   arch="x86_64"
      # fi

      arch="x86_64"

      cp ./win/profile_win2022 ./profile_win2022

      python dependency_viewer.py -os=WIN -ar=$arch -v="$(VERSION)" -bn="$BUILD_NOTE" -a="$(Build.RequestedFor)" -cf="deploy_conanfile.py" -sc="C09QW35D2DR"
    condition: and(succeeded(), ne(variables['PUBLISH'], ''))
    displayName: Slack Dependency Manager
    continueOnError: true 
    env:
      ARCH: ${{ parameters.arch }}
      DEPENDENCY_MANAGER_SLACK_WEBHOOK: $(DEPENDENCY_MANAGER_SLACK_WEBHOOK)
      BUILD_TYPE: ""