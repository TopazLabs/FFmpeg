steps:
  # Temporary: install VS "C++ Clang tools for Windows" on Medusa, then
  # verify clang.exe exists. Remaining FFmpeg steps are skipped until this
  # install is confirmed.
  - powershell: |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }

      $installPath = (& $vswhere -latest -property installationPath).Trim()
      if (-not $installPath) { throw "vswhere did not return an install path" }
      $clang = Join-Path $installPath "VC\Tools\Llvm\x64\bin\clang.exe"

      Write-Host "whoami: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
      $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
      Write-Host "IsAdmin: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
      Write-Host "VS installPath: $installPath"
      Write-Host "expected clang: $clang"

      if (-not (Test-Path $clang)) {
        $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
        Write-Host "Installer dir contents:"
        Get-ChildItem $installerDir | Select-Object -ExpandProperty Name

        $setup = Join-Path $installerDir "setup.exe"
        if (-not (Test-Path $setup)) { $setup = Join-Path $installerDir "vs_installer.exe" }
        if (-not (Test-Path $setup)) { throw "neither setup.exe nor vs_installer.exe found" }

        Get-Process vs_installer, vs_installershell -ErrorAction SilentlyContinue |
          Stop-Process -Force -ErrorAction SilentlyContinue

        # setup.exe does not accept --wait (that flag is only on the bootstrapper).
        $setupArgs = @(
          "modify",
          "--installPath", $installPath,
          "--add", "Microsoft.VisualStudio.Component.VC.Llvm.Clang",
          "--add", "Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset",
          "--quiet", "--norestart", "--force", "--noUpdateInstaller"
        )
        Write-Host "Running: $setup $($setupArgs -join ' ')"
        $proc = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru -NoNewWindow
        Write-Host "installer exit code: $($proc.ExitCode)"
        Get-Process setup, vs_installer, vs_installershell -ErrorAction SilentlyContinue |
          Wait-Process -Timeout 1500 -ErrorAction SilentlyContinue
        if (@(0, 3010, 1641) -notcontains $proc.ExitCode) {
          throw "VS installer failed with exit code $($proc.ExitCode)"
        }
      } else {
        Write-Host "clang already present; skipping VS installer"
      }

      if (-not (Test-Path $clang)) {
        throw "clang.exe still missing after install: $clang"
      }

      Write-Host "===== clang --version ====="
      & $clang --version
      Write-Host "===== clang -print-targets ====="
      $targets = & $clang -print-targets 2>&1 | Out-String
      Write-Host $targets
      if ($targets -notmatch "nvptx") {
        throw "clang is present but NVPTX target is missing (needed for cuda_llvm)"
      }
      Write-Host "VS Clang tools + NVPTX OK"

      Write-Host "===== install probe done; skipping remaining pipeline steps ====="
      exit 1
    displayName: Install VS C++ Clang tools (then exit)
    timeoutInMinutes: 30

  - checkout: self
  - checkout: topaz-conan-dev
  - checkout: nv-codec-headers
  - checkout: pipeline-helper
    
  - template: set_tools_and_deps.yml
    parameters:
      OS: 'win'
      SHOULD_RESTORE_CONAN_CACHE: true

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      unix2dos ./build-scripts/win/configure-win.patch
      git apply ./build-scripts/win/configure-win.patch
      # Patches are already applied
      # git apply ./build-scripts/configure-zimg.patch
      # git apply ./build-scripts/configure-aom.patch
      git apply ./build-scripts/configure-dav1d.patch
      bash ./build-scripts/win/conan_win.sh
    displayName: Install conan packages

  - script: |
      pushd "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
      for /f "delims=" %%x in ('.\vswhere.exe -latest -property InstallationPath') do set VSPATH=%%x
      popd
      call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64

      cd /d "C:\msys64"
      set MSYSTEM=MINGW64
      C:\msys64\msys2_shell.cmd -defterm -no-start -mingw64 -c "$(cygpath '$(Build.SourcesDirectory)/FFmpeg/build-scripts/win/build_win.sh')"
    displayName: Set up MSVC toolchain and build

  - bash: |
      cd "$(Build.SourcesDirectory)/FFmpeg"
      if [[ "${BUILD_REASON}" == "PullRequest" || -z "${PUBLISH}" ]]; then
        exit 0
      else
        mkdir -p "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cp build-scripts/deploy_conanfile.py "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/conanfile.py"
        cp -Rp "output-conan"/* "$(Build.SourcesDirectory)/topaz-conan-dev/prebuilt/topaz-ffmpeg/$(VERSION)/windows_x86_64_2022/build_type=Release/"
        cd "$(Build.SourcesDirectory)/topaz-conan-dev"
        ./run_publish_prebuilt.sh --package-name topaz-ffmpeg --package-version "$(VERSION)" -r topaz-conan
      fi
    displayName: Publish to conan

  - bash: |
      cp "$(Build.SourcesDirectory)/pipeline-helper/dependency-manager/dependency_viewer.py" "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      cd "$(Build.SourcesDirectory)/FFmpeg/build-scripts"
      # if [ "$ARCH" == "ARM64" ]; then
      #   arch="armv8"
      # else
      #   arch="x86_64"
      # fi

      arch="x86_64"

      cp ./win/profile_win2022 ./profile_win2022

      python dependency_viewer.py -os=WIN -ar=$arch -v="$(VERSION)" -bn="$BUILD_NOTE" -a="$(Build.RequestedFor)" -cf="deploy_conanfile.py" -sc="C09QW35D2DR"
    condition: and(succeeded(), ne(variables['PUBLISH'], ''))
    displayName: Slack Dependency Manager
    continueOnError: true 
    env:
      ARCH: ${{ parameters.arch }}
      DEPENDENCY_MANAGER_SLACK_WEBHOOK: $(DEPENDENCY_MANAGER_SLACK_WEBHOOK)
      BUILD_TYPE: ""